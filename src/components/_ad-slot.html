<!-- =======================================================================
  _ad-slot.html — the two AdSense placeholders. On {{AD_SLOT_TOP}} and
  {{AD_SLOT_MID}} markers in a template. Replace the inner content with the
  AdSense <ins> block once the account is approved; the .ad-slot wrapper and
  data-ad-style attribute stay, so the surrounding layout does not shift.
  ======================================================================= -->

<!-- top ad slot (above the verdict box, below the kicker/H1) -->
<div class="ad-slot" data-ad="top" aria-hidden="true">
  <span class="ad-label">Advertisement</span>
  <div class="ad-frame"></div>
</div>

<!-- mid ad slot (mid-article, after the first H2 block) -->
<div class="ad-slot" data-ad="mid" aria-hidden="true">
  <span class="ad-label">Advertisement</span>
  <div class="ad-frame"></div>
</div>
