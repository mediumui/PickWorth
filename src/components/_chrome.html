<!-- =======================================================================
  _chrome.html — shared site chrome, injected into every template.
  Four fragments, pulled out by l4_render.py on {{CHROME_*}} markers:
    {{CHROME_ICONS}}  -> the hidden SVG <symbol> sprite (all page icons)
    {{CHROME_HEADER}} -> the sticky <header class="site-header">
    {{CHROME_FOOTER}} -> the <footer class="site-footer">
    {{CHROME_MTAB}}   -> the mobile bottom tab bar <nav class="mtab">
  The <head> meta / JSON-LD / canonical / CSS / favicon block is NOT here;
  it is emitted by each template directly (it is page-specific).
  Every template MUST also load assets/js/device-ui.js — without it the
  body never gets .is-desktop / .is-mobile and the page falls through to
  the mobile-first default (top menu hidden, bottom tabs unstyled).
  ======================================================================= -->
