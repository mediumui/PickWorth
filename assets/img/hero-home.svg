<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 300" width="340" height="300" role="img" aria-labelledby="hhTitle">
  <title id="hhTitle">An editorial overview of what's covered</title>
  <defs>
    <style>
      .l{fill:none;stroke:#d8d1c1;stroke-width:1.3;stroke-linecap:round}
      .card{fill:#ffffff;stroke:#d8d1c1;stroke-width:1.3}
      .dim{fill:#e4ded1}
      .ac{fill:#b8503a}
      .acS{fill:none;stroke:#b8503a;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
      .mono{font-family:SFMono-Regular,Consolas,monospace;font-size:9.5px;letter-spacing:1.6px;fill:#b6afa3}
    </style>
  </defs>

  <!-- grid -->
  <g stroke="#efeade" stroke-width="1">
    <line x1="40" y1="70"  x2="300" y2="70"/>
    <line x1="40" y1="104" x2="300" y2="104"/>
    <line x1="40" y1="138" x2="300" y2="138"/>
    <line x1="40" y1="172" x2="300" y2="172"/>
    <line x1="40" y1="206" x2="300" y2="206"/>
  </g>

  <!-- masthead bar -->
  <rect class="card" x="46" y="44" width="226" height="40" rx="4"/>
  <rect x="46" y="44" width="226" height="40" rx="4" fill="none" stroke="#b8503a" stroke-width="1.2" opacity=".3"/>
  <path d="M64 72 L74 54 L84 72 Z" fill="none" stroke="#b8503a" stroke-width="1.8" stroke-linejoin="round"/>
  <circle cx="74" cy="67" r="1.6" fill="#b8503a"/>
  <rect class="ac" x="96" y="58" width="84" height="5" opacity=".7"/>
  <rect class="dim" x="96" y="70" width="64" height="3"/>
  <circle cx="250" cy="64" r="12" fill="#ffffff" stroke="#b8503a" stroke-width="1.5"/>
  <path class="acS" d="M244.5 64 L248.5 68.2 L255.6 60.2"/>

  <!-- four section tiles: reviews / comparisons / lists / journal -->
  <g>
    <rect class="card" x="46"  y="98"  width="110" height="62" rx="4"/>
    <rect class="card" x="164" y="98"  width="108" height="62" rx="4"/>
    <rect class="card" x="46"  y="172" width="110" height="62" rx="4"/>
    <rect class="card" x="164" y="172" width="108" height="62" rx="4"/>
  </g>

  <!-- reviews tile (accent): mini card + score -->
  <rect class="ac" x="60" y="110" width="40" height="3.6" opacity=".7"/>
  <rect class="dim" x="60" y="120" width="52" height="2.6"/>
  <rect class="dim" x="60" y="130" width="34" height="2.6"/>
  <circle cx="138" cy="130" r="14" fill="#ffffff" stroke="#b8503a" stroke-width="1.4"/>
  <text x="138" y="134" text-anchor="middle" font-family="SFMono-Regular,Consolas,monospace" font-size="11" fill="#1c1a17">4.4</text>

  <!-- comparisons tile: two bars + vs -->
  <rect class="dim" x="178" y="114" width="58" height="5" rx="1"/>
  <rect class="ac"  x="178" y="126" width="40" height="5" rx="1" opacity=".75"/>
  <circle cx="250" cy="120" r="9" fill="#ffffff" stroke="#b8503a" stroke-width="1.2"/>
  <text x="250" y="124" text-anchor="middle" font-family="SFMono-Regular,Consolas,monospace" font-size="8" fill="#b8503a">VS</text>

  <!-- lists tile: ranked lines -->
  <circle cx="60" cy="188" r="7" fill="#ffffff" stroke="#b8503a" stroke-width="1.3"/>
  <text x="60" y="191.5" text-anchor="middle" font-family="SFMono-Regular,Consolas,monospace" font-size="8.5" fill="#b8503a">1</text>
  <rect class="ac" x="74" y="186" width="40" height="3.6" opacity=".7"/>
  <circle cx="60" cy="206" r="7" fill="#ffffff" stroke="#d8d1c1" stroke-width="1.3"/>
  <text x="60" y="209.5" text-anchor="middle" font-family="SFMono-Regular,Consolas,monospace" font-size="8.5" fill="#b6afa3">2</text>
  <rect class="dim" x="74" y="204" width="50" height="3"/>

  <!-- journal tile: open book lines -->
  <rect class="ac" x="178" y="184" width="44" height="3.6" opacity=".7"/>
  <rect class="dim" x="178" y="196" width="56" height="2.6"/>
  <rect class="dim" x="178" y="206" width="38" height="2.6"/>
  <rect x="178" y="214" width="62" height="4" rx="1" fill="#b8503a" opacity=".25"/>

  <!-- section labels -->
  <g class="mono" font-size="8.4" letter-spacing="1">
    <text x="46"  y="94">REVIEWS</text>
    <text x="164" y="94">COMPARE</text>
    <text x="46"  y="168">LISTS</text>
    <text x="164" y="168">JOURNAL</text>
  </g>

  <!-- baseline -->
  <line x1="46" y1="268" x2="272" y2="268" stroke="#d8d1c1" stroke-width="1.3"/>
  <g stroke="#c9c2b4" stroke-width="1.2">
    <line x1="46"  y1="264" x2="46"  y2="272"/>
    <line x1="104" y1="264" x2="104" y2="272"/>
    <line x1="162" y1="264" x2="162" y2="272"/>
    <line x1="220" y1="264" x2="220" y2="272"/>
    <line x1="272" y1="264" x2="272" y2="272"/>
  </g>
  <text class="mono" x="46" y="288">EVERYTHING, TESTED FIRST</text>

  <!-- red tick -->
  <rect class="ac" x="46" y="36" width="18" height="2" opacity=".45"/>
</svg>
