<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 300" width="340" height="300" role="img" aria-labelledby="hcmTitle">
  <title id="hcmTitle">Two tools, scored on the same dimensions</title>
  <defs>
    <style>
      .l{fill:none;stroke:#d8d1c1;stroke-width:1.3;stroke-linecap:round}
      .card{fill:#ffffff;stroke:#d8d1c1;stroke-width:1.3}
      .dim{fill:#e4ded1}
      .ac{fill:#b8503a}
      .acS{fill:none;stroke:#b8503a;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
      .mono{font-family:SFMono-Regular,Consolas,monospace;font-size:9.5px;letter-spacing:1.6px;fill:#b6afa3}
    </style>
  </defs>

  <!-- grid -->
  <g stroke="#efeade" stroke-width="1">
    <line x1="40" y1="70"  x2="300" y2="70"/>
    <line x1="40" y1="110" x2="300" y2="110"/>
    <line x1="40" y1="150" x2="300" y2="150"/>
    <line x1="40" y1="190" x2="300" y2="190"/>
    <line x1="40" y1="230" x2="300" y2="230"/>
  </g>

  <!-- two parallel cards -->
  <rect class="card" x="48"  y="70" width="104" height="150" rx="5"/>
  <rect class="card" x="188" y="70" width="104" height="150" rx="5"/>
  <rect x="188" y="70" width="104" height="150" rx="5" fill="none" stroke="#b8503a" stroke-width="1.4" opacity=".4"/>

  <!-- left card header -->
  <rect class="dim"  x="64"  y="88" width="56" height="4" opacity=".55"/>
  <rect class="ac"   x="204" y="88" width="56" height="4" opacity=".7"/>

  <!-- dimension rows, with differing fills (one wins here, the other there) -->
  <g>
    <rect class="dim"  x="64"  y="112" width="72" height="6" rx="1"/>
    <rect class="ac"   x="204" y="112" width="44" height="6" rx="1" opacity=".75"/>
    <rect class="ac"   x="64"  y="136" width="60" height="6" rx="1" opacity=".75"/>
    <rect class="dim"  x="204" y="136" width="76" height="6" rx="1"/>
    <rect class="dim"  x="64"  y="160" width="52" height="6" rx="1"/>
    <rect class="ac"   x="204" y="160" width="70" height="6" rx="1" opacity=".75"/>
    <rect class="ac"   x="64"  y="184" width="70" height="6" rx="1" opacity=".75"/>
    <rect class="dim"  x="204" y="184" width="50" height="6" rx="1"/>
  </g>

  <!-- dimension labels -->
  <g class="mono">
    <text x="64"  y="104" font-size="8.6" letter-spacing="1.2">DIM 01</text>
    <text x="64"  y="128" font-size="8.6" letter-spacing="1.2">DIM 02</text>
    <text x="64"  y="152" font-size="8.6" letter-spacing="1.2">DIM 03</text>
    <text x="64"  y="176" font-size="8.6" letter-spacing="1.2">DIM 04</text>
  </g>

  <!-- center vs marker -->
  <line x1="166" y1="80" x2="166" y2="210" stroke="#d8d1c1" stroke-width="1.2" stroke-dasharray="3 4"/>
  <circle cx="166" cy="145" r="15" fill="#ffffff" stroke="#b8503a" stroke-width="1.5"/>
  <text x="166" y="149" text-anchor="middle" font-family="SFMono-Regular,Consolas,monospace" font-size="11" fill="#b8503a">VS</text>

  <!-- baseline -->
  <line x1="48" y1="244" x2="292" y2="244" stroke="#d8d1c1" stroke-width="1.3"/>
  <g stroke="#c9c2b4" stroke-width="1.2">
    <line x1="48"  y1="240" x2="48"  y2="248"/>
    <line x1="132" y1="240" x2="132" y2="248"/>
    <line x1="216" y1="240" x2="216" y2="248"/>
    <line x1="292" y1="240" x2="292" y2="248"/>
  </g>
  <text class="mono" x="48" y="268">SCORED PER DIMENSION</text>

  <!-- red tick -->
  <rect class="ac" x="48" y="58" width="18" height="2" opacity=".45"/>
</svg>
