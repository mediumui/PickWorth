<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 300" width="340" height="300" role="img" aria-labelledby="haTitle">
  <title id="haTitle">Editorial standards we hold to, signed in the open</title>
  <defs>
    <style>
      .l{fill:none;stroke:#d8d1c1;stroke-width:1.3;stroke-linecap:round}
      .card{fill:#ffffff;stroke:#d8d1c1;stroke-width:1.3}
      .dim{fill:#e4ded1}
      .ac{fill:#b8503a}
      .acS{fill:none;stroke:#b8503a;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
      .mono{font-family:SFMono-Regular,Consolas,monospace;font-size:9.5px;letter-spacing:1.6px;fill:#b6afa3}
    </style>
  </defs>

  <!-- grid -->
  <g stroke="#efeade" stroke-width="1">
    <line x1="40" y1="70"  x2="300" y2="70"/>
    <line x1="40" y1="104" x2="300" y2="104"/>
    <line x1="40" y1="138" x2="300" y2="138"/>
    <line x1="40" y1="172" x2="300" y2="172"/>
    <line x1="40" y1="206" x2="300" y2="206"/>
  </g>

  <!-- standards document -->
  <rect class="card" x="54" y="56" width="188" height="176" rx="5"/>
  <rect x="54" y="56" width="188" height="176" rx="5" fill="none" stroke="#b8503a" stroke-width="1.2" opacity=".3"/>
  <!-- title line -->
  <rect class="ac" x="72" y="74" width="70" height="4.5" opacity=".7"/>
  <rect class="dim" x="72" y="86" width="96" height="3"/>
  <!-- checklist rows -->
  <g>
    <rect x="72" y="112" width="14" height="14" rx="2.5" fill="#ffffff" stroke="#b8503a" stroke-width="1.5"/>
    <path class="acS" d="M75 119 L78 122 L83 114"/>
    <rect class="dim" x="98" y="118" width="90" height="3"/>

    <rect x="72" y="138" width="14" height="14" rx="2.5" fill="#ffffff" stroke="#b8503a" stroke-width="1.5"/>
    <path class="acS" d="M75 145 L78 148 L83 140"/>
    <rect class="dim" x="98" y="144" width="74" height="3"/>

    <rect x="72" y="164" width="14" height="14" rx="2.5" fill="#ffffff" stroke="#b8503a" stroke-width="1.5"/>
    <path class="acS" d="M75 171 L78 174 L83 166"/>
    <rect class="dim" x="98" y="170" width="98" height="3"/>
  </g>
  <!-- signature line -->
  <line x1="72" y1="212" x2="150" y2="212" stroke="#d8d1c1" stroke-width="1.2"/>
  <path class="acS" d="M74 208 C84 196 92 214 100 206 C108 198 116 214 126 204" opacity=".7"/>
  <text class="mono" x="154" y="212" font-size="8.2" letter-spacing="1">SIGNED</text>

  <!-- seal / stamp (rotated) -->
  <g transform="rotate(-12 250 96)">
    <circle cx="250" cy="96" r="30" fill="#ffffff" stroke="#b8503a" stroke-width="1.6"/>
    <circle cx="250" cy="96" r="22" fill="none" stroke="#b8503a" stroke-width="1" opacity=".5"/>
    <path d="M250 78 A18 18 0 0 1 268 96" fill="none" stroke="#b8503a" stroke-width="2" stroke-linecap="round"/>
    <text x="250" y="100" text-anchor="middle" font-family="SFMono-Regular,Consolas,monospace" font-size="10.5" fill="#b8503a" letter-spacing="1">OPEN</text>
    <text x="250" y="112" text-anchor="middle" font-family="SFMono-Regular,Consolas,monospace" font-size="8.5" fill="#b6afa3" letter-spacing="1">CORRECTS</text>
  </g>

  <!-- connector seal -> doc -->
  <path class="l" d="M232 118 C220 132 214 140 206 148"/>

  <!-- baseline -->
  <line x1="54" y1="268" x2="290" y2="268" stroke="#d8d1c1" stroke-width="1.3"/>
  <g stroke="#c9c2b4" stroke-width="1.2">
    <line x1="54"  y1="264" x2="54"  y2="272"/>
    <line x1="114" y1="264" x2="114" y2="272"/>
    <line x1="174" y1="264" x2="174" y2="272"/>
    <line x1="234" y1="264" x2="234" y2="272"/>
    <line x1="290" y1="264" x2="290" y2="272"/>
  </g>
  <text class="mono" x="54" y="288">STANDARDS, IN THE OPEN</text>

  <!-- red tick -->
  <rect class="ac" x="54" y="48" width="18" height="2" opacity=".45"/>
</svg>
