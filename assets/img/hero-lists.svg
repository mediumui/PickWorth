<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 300" width="340" height="300" role="img" aria-labelledby="hlTitle">
  <title id="hlTitle">A shortlist, ranked for the job</title>
  <defs>
    <style>
      .l{fill:none;stroke:#d8d1c1;stroke-width:1.3;stroke-linecap:round}
      .card{fill:#ffffff;stroke:#d8d1c1;stroke-width:1.3}
      .dim{fill:#e4ded1}
      .ac{fill:#b8503a}
      .acS{fill:none;stroke:#b8503a;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
      .mono{font-family:SFMono-Regular,Consolas,monospace;font-size:9.5px;letter-spacing:1.6px;fill:#b6afa3}
    </style>
  </defs>

  <!-- grid -->
  <g stroke="#efeade" stroke-width="1">
    <line x1="40" y1="70"  x2="300" y2="70"/>
    <line x1="40" y1="104" x2="300" y2="104"/>
    <line x1="40" y1="138" x2="300" y2="138"/>
    <line x1="40" y1="172" x2="300" y2="172"/>
    <line x1="40" y1="206" x2="300" y2="206"/>
  </g>

  <!-- ranked rows -->
  <!-- rank 1 highlighted -->
  <g>
    <rect class="card" x="58" y="58" width="204" height="30" rx="4"/>
    <rect x="58" y="58" width="204" height="30" rx="4" fill="none" stroke="#b8503a" stroke-width="1.5"/>
    <circle cx="76" cy="73" r="10" fill="#b8503a"/>
    <text x="76" y="77" text-anchor="middle" font-family="SFMono-Regular,Consolas,monospace" font-size="11" fill="#faf8f3">1</text>
    <rect class="ac" x="96" y="71" width="54" height="4" opacity=".7"/>
    <rect class="dim" x="96" y="80" width="120" height="2.6"/>
    <rect class="ac" x="238" y="69" width="16" height="10" rx="1"/>
    <rect class="ac" x="256" y="71" width="12" height="8" rx="1"/>
  </g>
  <!-- rank 2 -->
  <g>
    <rect class="card" x="58" y="92" width="204" height="30" rx="4"/>
    <circle cx="76" cy="107" r="10" fill="#ffffff" stroke="#b8503a" stroke-width="1.5"/>
    <text x="76" y="111" text-anchor="middle" font-family="SFMono-Regular,Consolas,monospace" font-size="11" fill="#b8503a">2</text>
    <rect class="dim" x="96" y="105" width="62" height="4" opacity=".55"/>
    <rect class="dim" x="96" y="114" width="110" height="2.6"/>
    <rect class="dim" x="238" y="103" width="16" height="10" rx="1" opacity=".5"/>
  </g>
  <!-- rank 3 -->
  <g>
    <rect class="card" x="58" y="126" width="204" height="30" rx="4"/>
    <circle cx="76" cy="141" r="10" fill="#ffffff" stroke="#d8d1c1" stroke-width="1.5"/>
    <text x="76" y="145" text-anchor="middle" font-family="SFMono-Regular,Consolas,monospace" font-size="11" fill="#b6afa3">3</text>
    <rect class="dim" x="96" y="139" width="50" height="4" opacity=".55"/>
    <rect class="dim" x="96" y="148" width="96" height="2.6"/>
  </g>
  <!-- rank 4 -->
  <g>
    <rect class="card" x="58" y="160" width="204" height="30" rx="4"/>
    <circle cx="76" cy="175" r="10" fill="#ffffff" stroke="#d8d1c1" stroke-width="1.5"/>
    <text x="76" y="179" text-anchor="middle" font-family="SFMono-Regular,Consolas,monospace" font-size="11" fill="#b6afa3">4</text>
    <rect class="dim" x="96" y="173" width="68" height="4" opacity=".55"/>
    <rect class="dim" x="96" y="182" width="84" height="2.6"/>
  </g>

  <!-- bar legend -->
  <text class="mono" x="58" y="224">RANKED</text>
  <g>
    <rect x="58" y="238" width="204" height="8" rx="2" fill="#e4ded1"/>
    <rect x="58" y="238" width="150" height="8" rx="2" fill="#b8503a" opacity=".75"/>
    <rect x="58" y="254" width="204" height="8" rx="2" fill="#e4ded1"/>
    <rect x="58" y="254" width="118" height="8" rx="2" fill="#b8503a" opacity=".55"/>
  </g>

  <!-- baseline -->
  <line x1="58" y1="284" x2="262" y2="284" stroke="#d8d1c1" stroke-width="1.3"/>
  <g stroke="#c9c2b4" stroke-width="1.2">
    <line x1="58"  y1="280" x2="58"  y2="288"/>
    <line x1="150" y1="280" x2="150" y2="288"/>
    <line x1="242" y1="280" x2="242" y2="288"/>
  </g>
  <text class="mono" x="262" y="288" text-anchor="end">PICKS BY JOB</text>

  <!-- red tick -->
  <rect class="ac" x="58" y="50" width="18" height="2" opacity=".45"/>
</svg>
