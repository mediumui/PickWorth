<svg xmlns="http://www.w3.org/2000/svg" width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <!-- brand logo mark -->
    <symbol id="i-logo" viewBox="0 0 32 32">
      <path d="M8 24 L16 8 L24 24 Z" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/>
      <circle cx="16" cy="19.5" r="1.7" fill="currentColor"/>
    </symbol>
    <!-- sources / documents -->
    <symbol id="i-sources" viewBox="0 0 24 24">
      <rect x="7" y="5" width="12" height="15" rx="2" fill="none" stroke="currentColor" stroke-width="1.7"/>
      <path d="M4 8v9a2 2 0 0 0 2 2h9" fill="none" stroke="currentColor" stroke-width="1.7" opacity=".45"/>
      <path d="M10 9.5h6M10 13h6M10 16.5h4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
    </symbol>
    <!-- side-by-side / compare -->
    <symbol id="i-compare" viewBox="0 0 24 24">
      <rect x="3.5" y="5" width="7.5" height="14" rx="2" fill="none" stroke="currentColor" stroke-width="1.7"/>
      <rect x="13" y="5" width="7.5" height="14" rx="2" fill="none" stroke="currentColor" stroke-width="1.7"/>
      <path d="M6.7 9v6M16.3 9v6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" opacity=".5"/>
      <circle cx="7.5" cy="12" r="0.9" fill="currentColor"/>
      <circle cx="16.5" cy="12" r="0.9" fill="currentColor"/>
    </symbol>
    <!-- verdict / check mark -->
    <symbol id="i-verdict" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.7"/>
      <path d="M8 12.2 L11 15.2 L16 9.2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <!-- method / process -->
    <symbol id="i-method" viewBox="0 0 24 24">
      <circle cx="6" cy="6" r="2.2" fill="none" stroke="currentColor" stroke-width="1.6"/>
      <circle cx="18" cy="12" r="2.2" fill="none" stroke="currentColor" stroke-width="1.6"/>
      <circle cx="7" cy="18" r="2.2" fill="none" stroke="currentColor" stroke-width="1.6"/>
      <path d="M8 7 L16 11M16 13.5 L9 17" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" opacity=".55"/>
    </symbol>
    <!-- search / pick -->
    <symbol id="i-pick" viewBox="0 0 24 24">
      <circle cx="10.5" cy="10.5" r="6" fill="none" stroke="currentColor" stroke-width="1.8"/>
      <path d="M15 15 L20 20" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/>
    </symbol>
    <!-- sparkle / new -->
    <symbol id="i-spark" viewBox="0 0 24 24">
      <path d="M12 4 L13.8 10.2 L20 12 L13.8 13.8 L12 20 L10.2 13.8 L4 12 L10.2 10.2 Z"
            fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
    </symbol>
    <!-- quote / citation -->
    <symbol id="i-cite" viewBox="0 0 24 24">
      <path d="M5 13v4a2 2 0 0 0 2 2h4v-7H7a2 2 0 0 1-2-2V9h4V4H7a2 2 0 0 0-2 2v2a2 2 0 0 0 0 0ZM13 13v4a2 2 0 0 0 2 2h4v-7h-4a2 2 0 0 1-2-2V9h4V4h-4a2 2 0 0 0-2 2v2Z"
            fill="currentColor" opacity=".55"/>
    </symbol>
  </defs>
</svg>
