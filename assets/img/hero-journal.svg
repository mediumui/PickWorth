<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 300" width="340" height="300" role="img" aria-labelledby="hjTitle">
  <title id="hjTitle">Shorter notes from the desk, dated and filed</title>
  <defs>
    <style>
      .l{fill:none;stroke:#d8d1c1;stroke-width:1.3;stroke-linecap:round}
      .card{fill:#ffffff;stroke:#d8d1c1;stroke-width:1.3}
      .dim{fill:#e4ded1}
      .ac{fill:#b8503a}
      .acS{fill:none;stroke:#b8503a;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
      .mono{font-family:SFMono-Regular,Consolas,monospace;font-size:9.5px;letter-spacing:1.6px;fill:#b6afa3}
    </style>
  </defs>

  <!-- grid -->
  <g stroke="#efeade" stroke-width="1">
    <line x1="40" y1="70"  x2="300" y2="70"/>
    <line x1="40" y1="106" x2="300" y2="106"/>
    <line x1="40" y1="142" x2="300" y2="142"/>
    <line x1="40" y1="178" x2="300" y2="178"/>
    <line x1="40" y1="214" x2="300" y2="214"/>
  </g>

  <!-- open journal: spine + two pages -->
  <g>
    <path d="M56 92 C110 78 152 78 168 88 C184 78 226 78 284 92 L284 216 C230 204 188 204 168 214 C148 204 110 204 56 216 Z"
          class="card"/>
    <line x1="168" y1="88" x2="168" y2="214" stroke="#d8d1c1" stroke-width="1.2"/>
    <!-- left page lines -->
    <rect class="dim" x="74"  y="106" width="78" height="3"/>
    <rect class="dim" x="74"  y="118" width="64" height="3"/>
    <rect class="dim" x="74"  y="130" width="78" height="3"/>
    <rect class="dim" x="74"  y="142" width="54" height="3"/>
    <rect class="dim" x="74"  y="166" width="70" height="3"/>
    <rect class="dim" x="74"  y="178" width="46" height="3"/>
    <!-- right page: a highlighted note -->
    <rect class="ac" x="184" y="106" width="72" height="4" opacity=".7"/>
    <rect class="dim" x="184" y="118" width="76" height="3"/>
    <rect class="dim" x="184" y="130" width="58" height="3"/>
    <rect x="184" y="150" width="78" height="22" rx="2" fill="none" stroke="#b8503a" stroke-width="1.2" opacity=".5"/>
    <rect class="dim" x="192" y="158" width="52" height="3"/>
    <rect class="dim" x="192" y="166" width="34" height="3"/>
  </g>

  <!-- date ticks along right margin -->
  <g class="mono" font-size="8.4" letter-spacing="1">
    <text x="290" y="110">OCT 08</text>
    <text x="290" y="150">OCT 15</text>
    <text x="290" y="190">OCT 22</text>
  </g>
  <g stroke="#c9c2b4" stroke-width="1.1">
    <line x1="284" y1="106" x2="284" y2="194"/>
  </g>
  <circle cx="290" cy="214" r="4" fill="#b8503a"/>

  <!-- baseline -->
  <line x1="56" y1="248" x2="284" y2="248" stroke="#d8d1c1" stroke-width="1.3"/>
  <g stroke="#c9c2b4" stroke-width="1.2">
    <line x1="56"  y1="244" x2="56"  y2="252"/>
    <line x1="120" y1="244" x2="120" y2="252"/>
    <line x1="184" y1="244" x2="184" y2="252"/>
    <line x1="248" y1="244" x2="248" y2="252"/>
    <line x1="284" y1="244" x2="284" y2="252"/>
  </g>
  <text class="mono" x="56" y="272">FROM THE DESK</text>

  <!-- red accent tick -->
  <rect class="ac" x="56" y="60" width="18" height="2" opacity=".45"/>
</svg>
